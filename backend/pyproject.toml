[project]
name = "market-alerts-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.2",
    "feedparser>=6.0",
    "httpx>=0.27",
    "telethon>=1.36",
    "firebase-admin>=6.5",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "pypdf>=4.0",
    "websockets>=13.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
